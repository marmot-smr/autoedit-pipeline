<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoEdit — библиотека приёмов</title>
  <style>
    :root {
      --bg: #111114;
      --bg-2: #18181c;
      --bg-3: #1f1f24;
      --line: #2a2a31;
      --text: #e8e6e1;
      --muted: #9a968c;
      --dim: #6e6a62;
      --accent: #c4a574;
      --ok: #8aa87a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
    aside {
      border-right: 1px solid var(--line);
      background: var(--bg-2);
      display: flex; flex-direction: column; min-height: 0;
    }
    .brand { padding: 20px 18px 12px; border-bottom: 1px solid var(--line); }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .filters { padding: 12px 14px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .chip {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px;
    }
    .chip.on { border-color: var(--accent); color: var(--text); background: #2a241c; }
    .list { overflow: auto; flex: 1; }
    .row {
      width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; color: inherit; padding: 12px 16px; cursor: pointer;
    }
    .row:hover { background: var(--bg-3); }
    .row.active { background: #242018; border-left: 2px solid var(--accent); padding-left: 14px; }
    .row .t { display: block; font-weight: 600; }
    .row .m { display: block; margin-top: 3px; color: var(--dim); font-size: 12px; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stage { padding: 22px 28px 28px; overflow: auto; }
    .kicker { color: var(--accent); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 8px; }
    h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    .meta { color: var(--muted); margin-bottom: 18px; }
    .preview {
      background: #000; aspect-ratio: 16 / 9; max-width: 720px; width: 100%;
      border: 1px solid var(--line); overflow: hidden; position: relative;
    }
    .preview iframe, .preview img { width: 100%; height: 100%; border: 0; object-fit: cover; display: block; }
    .preview .ph {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); padding: 24px; text-align: center; background: #16140f;
    }
    .block { margin-top: 22px; max-width: 720px; }
    .block h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    ul.rules { margin: 0; padding-left: 18px; }
    ul.rules li { margin: 0 0 6px; }
    .jobs { display: flex; flex-direction: column; gap: 8px; }
    .job {
      border: 1px solid var(--line); background: var(--bg-2); padding: 12px 14px;
    }
    .job strong { display: block; }
    .job span { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
    .pill.ready { color: var(--ok); border-color: #3a4a34; }
    .pill.stub { color: var(--accent); }
    code { font-size: 12px; color: var(--accent); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>Библиотека приёмов</h1>
        <p>Гайды YouTube и стили сессий. Ссылайся по <code>id</code>.</p>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </aside>
    <main>
      <div class="stage" id="stage"></div>
    </main>
  </div>
  <script src="data.js"></script>
  <script>
    const items = window.AUTOEDIT_LIBRARY || [];
    const kinds = ["all", ...Array.from(new Set(items.map(i => i.kind)))];
    let filter = "all";
    let selected = items[0] ? items[0].id : null;

    const filtersEl = document.getElementById("filters");
    const listEl = document.getElementById("list");
    const stageEl = document.getElementById("stage");

    function labelKind(k) {
      return ({ guide: "гайд", style: "стиль", effect: "эффект", all: "все" })[k] || k;
    }

    function renderFilters() {
      filtersEl.innerHTML = kinds.map(k =>
        `<button class="chip ${filter===k?"on":""}" data-k="${k}">${labelKind(k)}</button>`
      ).join("");
    }

    function visible() {
      return items.filter(i => filter === "all" || i.kind === filter);
    }

    function renderList() {
      const vis = visible();
      listEl.innerHTML = vis.map(i => `
        <button class="row ${i.id===selected?"active":""}" data-id="${i.id}">
          <span class="t">${i.title}</span>
          <span class="m">${i.id} · ${i.source} · ${(i.applied_in||[]).length} джоб</span>
        </button>
      `).join("");
    }

    function previewHtml(item) {
      if (item.youtube_id) {
        const src = `https://www.youtube.com/embed/${item.youtube_id}`;
        return `<div class="preview"><iframe src="${src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      return `<div class="preview"><div class="ph">${item.summary || "Приём из сессии — YouTube-превью появится после импорта гайда."}</div></div>`;
    }

    function renderStage() {
      const item = items.find(i => i.id === selected);
      if (!item) {
        stageEl.innerHTML = "<p class='meta'>Каталог пуст. Кинь ссылку на YouTube в чат или <code>.\\run.ps1 -LibraryIngest -Url ...</code></p>";
        return;
      }
      const link = item.youtube_url
        ? `<a href="${item.youtube_url}" target="_blank" rel="noopener">Открыть на YouTube</a>`
        : "Источник: сессия пайплайна (не YouTube)";
      const rules = (item.learned_rules || []).map(r => `<li>${r}</li>`).join("") || "<li>Пока stub — агент заполнит после просмотра гайда.</li>";
      const jobs = (item.applied_in || []);
      const jobsHtml = jobs.length
        ? jobs.map(j => `<div class="job"><strong>${j.title || j.job}</strong><span>${j.job} · ${j.when || ""}</span><div>${j.note || ""}</div></div>`).join("")
        : "<p class='meta'>Ещё не применяли в джобах.</p>";
      const tags = (item.tags || []).map(t => `<span class="pill">${t}</span>`).join("");
      stageEl.innerHTML = `
        <p class="kicker">${labelKind(item.kind)}</p>
        <h2>${item.title}</h2>
        <div class="meta">
          <span class="pill ${item.status}">${item.status}</span>
          ${tags}
          <code>${item.id}</code>
          · ${link}
        </div>
        ${previewHtml(item)}
        <div class="block">
          <h3>Что вынесли</h3>
          <p>${item.summary || ""}</p>
          <ul class="rules">${rules}</ul>
        </div>
        <div class="block">
          <h3>Где уже применяли</h3>
          <div class="jobs">${jobsHtml}</div>
        </div>
      `;
    }

    function draw() {
      renderFilters();
      renderList();
      renderStage();
    }

    filtersEl.addEventListener("click", e => {
      const b = e.target.closest("[data-k]");
      if (!b) return;
      filter = b.dataset.k;
      const vis = visible();
      if (!vis.some(i => i.id === selected) && vis[0]) selected = vis[0].id;
      draw();
    });
    listEl.addEventListener("click", e => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      selected = b.dataset.id;
      draw();
    });

    draw();
  </script>
</body>
</html>
